<style>
  :root {
    --fondo: #f5f6f8;
    --tarjeta: #ffffff;
    --texto: #1c1d20;
    --suave: #6b7280;
    --borde: #e2e4e9;
    --acento: #1f6feb;
    --error: #b42318;
    --ok: #12703a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--fondo);
    color: var(--texto);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  .sub { color: var(--suave); font-size: 14px; margin: 0 0 16px; }
  .tarjeta {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .saldo { font-size: 32px; font-weight: 600; margin: 4px 0 0; }
  label { display: block; font-size: 14px; margin: 12px 0 4px; }
  select, input, button, textarea {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid var(--borde);
    border-radius: 8px;
    font-family: inherit;
  }
  button {
    background: var(--acento);
    color: #fff;
    border: none;
    font-weight: 600;
    margin-top: 14px;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--borde); }
  th { color: var(--suave); font-weight: 500; }
  td.valor, th.valor { text-align: right; white-space: nowrap; }
  .aviso { padding: 10px; border-radius: 8px; font-size: 14px; margin-top: 12px; }
  .aviso.error { background: #fdeceb; color: var(--error); }
  .aviso.ok { background: #e7f4ec; color: var(--ok); }
  .vacio { color: var(--suave); font-size: 14px; }

  .paginador {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 10px 0 16px;
  }
  .paginador button { width: auto; margin: 0; padding: 6px 12px; font-size: 13px; }
  .paginador span { color: var(--suave); font-size: 13px; white-space: nowrap; }

  .spinner {
    display: block;
    width: 18px;
    height: 18px;
    margin: 10px auto 0;
    border: 2px solid var(--borde);
    border-top-color: var(--acento);
    border-radius: 50%;
    animation: girar 0.6s linear infinite;
  }
  .spinner[hidden] { display: none; }
  @keyframes girar {
    to { transform: rotate(360deg); }
  }

  details.seccion {
    background: var(--tarjeta);
    border: 1px solid var(--borde);
    border-radius: 10px;
    margin-bottom: 10px;
  }
  details.seccion > summary {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    list-style: none;
  }
  details.seccion > summary::-webkit-details-marker { display: none; }
  details.seccion > summary::before { content: '\25B8'; color: var(--suave); }
  details.seccion[open] > summary::before { content: '\25BE'; }
  details.seccion[open] > summary { border-bottom: 1px solid var(--borde); }
  .cuerpo { padding: 16px; }
  .bloque + .bloque {
    border-top: 1px solid var(--borde);
    margin-top: 20px;
    padding-top: 16px;
  }
  .bloque > h3 { font-size: 15px; margin: 0 0 4px; }
  .bloque > h4 { font-size: 14px; color: var(--suave); font-weight: 500; margin: 20px 0 4px; }

  .rejilla { display: grid; grid-template-columns: 1fr; gap: 12px 16px; }
  .campo label { margin: 0 0 4px; }
  .campo-ancho { grid-column: 1 / -1; }
  .rejilla button { margin-top: 0; }
  .lista-productos { display: grid; gap: 8px; margin-top: 12px; }
  .producto-admin {
    border: 1px solid var(--borde);
    border-radius: 10px;
    background: var(--tarjeta);
  }
  .producto-admin[open] { border-color: var(--acento); }
  .producto-admin.inactivo > summary { opacity: 0.55; }
  .producto-admin > summary {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    cursor: pointer;
    list-style: none;
  }
  .producto-admin > summary::-webkit-details-marker { display: none; }
  .pa-titulo { display: flex; flex-direction: column; min-width: 0; }
  .pa-titulo strong { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pa-categoria { font-size: 12px; color: var(--suave); }
  .pa-precio { font-weight: 600; font-size: 15px; white-space: nowrap; }
  .pa-stock {
    min-width: 62px;
    text-align: center;
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    background: #e7f4ec;
    color: var(--ok);
    white-space: nowrap;
  }
  .pa-stock.bajo { background: #fff4e0; color: #8a5a00; }
  .pa-stock.agotado { background: #fdeceb; color: var(--error); }
  .pa-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 12px;
    padding: 12px;
    border-top: 1px solid var(--borde);
  }
  .pa-campo.pa-ancho, .pa-costo, .pa-pie { grid-column: 1 / -1; }
  .pa-rotulo { display: block; font-size: 12px; color: var(--suave); margin-bottom: 2px; }
  .pa-campo input { padding: 8px; font-size: 15px; }
  .pa-costo { margin: 0; font-size: 13px; color: var(--suave); }
  .pa-pie { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .pa-activo { display: flex; align-items: center; gap: 6px; margin: 0; }
  .pa-activo input { width: auto; }
  .pa-pie button { width: auto; margin: 0; padding: 8px 20px; }
  @media (min-width: 720px) {
    body { max-width: 720px; margin: 0 auto; }
    .rejilla { grid-template-columns: 1fr 1fr; }
  }

  @media (min-width: 1100px) {
    body.admin { max-width: 1320px; }
    body.admin .cuerpo {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
      align-items: start;
    }
    body.admin .bloque,
    body.admin .bloque + .bloque {
      margin: 0;
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 10px;
    }
    body.admin .bloque:has(table),
    body.admin .bloque:has(.lista-productos) { grid-column: 1 / -1; }
    body.admin .lista-productos { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  }
  @media (min-width: 1500px) {
    body.admin { max-width: 1560px; }
    body.admin .lista-productos { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
