<!DOCTYPE html>
<html lang="es">
  <head>
    <base target="_top">
    <?!= incluir('web/estilos') ?>
  </head>
  <body>
    <div id="cargando" class="tarjeta">Cargando...</div>

    <div id="login" class="tarjeta" hidden>
      <h1>Tienda Sistemas</h1>
      <p class="sub">Ingrese con el usuario que le asigno el administrador.</p>
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" autocomplete="username">
      <label for="clave">Clave</label>
      <input id="clave" type="password" autocomplete="current-password">
      <button id="btnEntrar">Entrar</button>
      <div id="avisoLogin"></div>
    </div>

    <div id="cuenta" hidden>
      <div class="tarjeta">
        <h1 id="saludo"></h1>
        <p class="sub">Saldo pendiente</p>
        <p class="saldo" id="saldo"></p>
      </div>

      <div class="tarjeta">
        <h2>Registrar lo que me llevo</h2>
        <table>
          <thead>
            <tr><th>Producto</th><th class="valor">Cantidad</th><th></th></tr>
          </thead>
          <tbody id="cuerpoTablaRegistro"></tbody>
        </table>
        <button id="btnAgregarLineaRegistro">Agregar producto</button>
        <button id="btnRegistrar">Registrar</button>
        <div id="avisoRegistro"></div>
      </div>

      <div class="tarjeta">
        <h2>Lo que estoy debiendo</h2>
        <table>
          <thead>
            <tr><th>Fecha</th><th>Concepto</th><th class="valor">Cant.</th><th class="valor">Valor</th></tr>
          </thead>
          <tbody id="desglose"></tbody>
        </table>
        <p id="sinDeuda" class="vacio" hidden>No tiene nada pendiente.</p>
      </div>
    </div>

    <script>
      var token = '';
      try { token = localStorage.getItem('tokenTienda') || ''; } catch (e) { token = ''; }
      var productosCache = [];
      var MAXIMO_LINEAS_REGISTRO = 3;
      var lineasRegistro = [{ productoId: '', cantidad: 1 }];

      function pesos(valor) {
        return '$' + Number(valor || 0).toLocaleString('es-CO');
      }

      function fechaCorta(iso) {
        var fecha = new Date(iso);
        if (isNaN(fecha.getTime())) { return String(iso); }
        return fecha.toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
      }

      function mostrarAviso(idContenedor, texto, esError) {
        var contenedor = document.getElementById(idContenedor);
        if (!texto) { contenedor.innerHTML = ''; return; }
        contenedor.innerHTML = '<div class="aviso ' + (esError ? 'error' : 'ok') + '"></div>';
        contenedor.firstChild.textContent = texto;
      }

      function llenarSelectProducto(select, productos) {
        select.innerHTML = '';
        var opcionVacia = document.createElement('option');
        opcionVacia.value = '';
        opcionVacia.textContent = 'Seleccione un producto';
        select.appendChild(opcionVacia);
        productos.slice().sort(function (a, b) {
          return a.nombre.localeCompare(b.nombre, 'es');
        }).forEach(function (producto) {
          var opcion = document.createElement('option');
          opcion.value = producto.id;
          var etiqueta = producto.alias ? producto.nombre + ' · ' + producto.alias : producto.nombre;
          opcion.textContent = etiqueta + ' - ' + pesos(producto.precioVenta) + ' (quedan ' + producto.stockActual + ')';
          opcion.disabled = producto.stockActual <= 0;
          select.appendChild(opcion);
        });
      }

      function pintarTablaRegistro() {
        var cuerpo = document.getElementById('cuerpoTablaRegistro');
        cuerpo.innerHTML = '';
        lineasRegistro.forEach(function (linea, indice) {
          var fila = document.createElement('tr');

          var celdaProducto = document.createElement('td');
          var select = document.createElement('select');
          llenarSelectProducto(select, productosCache);
          select.value = linea.productoId;
          if (select.value !== linea.productoId) { select.value = ''; linea.productoId = ''; }
          select.addEventListener('change', function () {
            lineasRegistro[indice].productoId = select.value;
          });
          celdaProducto.appendChild(select);

          var celdaCantidad = document.createElement('td');
          var inputCantidad = document.createElement('input');
          inputCantidad.type = 'number';
          inputCantidad.min = '1';
          inputCantidad.step = '1';
          inputCantidad.value = linea.cantidad;
          inputCantidad.addEventListener('input', function () {
            lineasRegistro[indice].cantidad = Number(inputCantidad.value);
          });
          celdaCantidad.appendChild(inputCantidad);

          var celdaQuitar = document.createElement('td');
          var botonQuitar = document.createElement('button');
          botonQuitar.textContent = 'quitar';
          botonQuitar.disabled = lineasRegistro.length === 1;
          botonQuitar.addEventListener('click', function () {
            if (lineasRegistro.length > 1) {
              lineasRegistro.splice(indice, 1);
              pintarTablaRegistro();
            }
          });
          celdaQuitar.appendChild(botonQuitar);

          fila.appendChild(celdaProducto);
          fila.appendChild(celdaCantidad);
          fila.appendChild(celdaQuitar);
          cuerpo.appendChild(fila);
        });
        document.getElementById('btnAgregarLineaRegistro').disabled = lineasRegistro.length >= MAXIMO_LINEAS_REGISTRO;
      }

      document.getElementById('btnAgregarLineaRegistro').addEventListener('click', function () {
        if (lineasRegistro.length < MAXIMO_LINEAS_REGISTRO) {
          lineasRegistro.push({ productoId: '', cantidad: 1 });
          pintarTablaRegistro();
        }
      });

      function pintarEstado(estado) {
        document.getElementById('cargando').hidden = true;
        if (!estado.autenticado) {
          document.getElementById('cuenta').hidden = true;
          document.getElementById('login').hidden = false;
          return;
        }
        document.getElementById('login').hidden = true;
        document.getElementById('cuenta').hidden = false;
        document.getElementById('saludo').textContent = 'Hola, ' + estado.nombre;
        document.getElementById('saldo').textContent = pesos(estado.saldo);

        productosCache = estado.productos;
        pintarTablaRegistro();

        var cuerpo = document.getElementById('desglose');
        cuerpo.innerHTML = '';
        estado.desglose.forEach(function (linea) {
          var fila = document.createElement('tr');
          [fechaCorta(linea.fecha), linea.concepto, String(linea.cantidad), pesos(linea.valorTotal)].forEach(function (texto, indice) {
            var celda = document.createElement('td');
            if (indice >= 2) { celda.className = 'valor'; }
            celda.textContent = texto;
            fila.appendChild(celda);
          });
          cuerpo.appendChild(fila);
        });
        document.getElementById('sinDeuda').hidden = estado.desglose.length > 0;
      }

      function cargarEstado() {
        google.script.run.withSuccessHandler(pintarEstado).apiObtenerEstado(token);
      }

      document.getElementById('btnEntrar').addEventListener('click', function () {
        var boton = this;
        boton.disabled = true;
        mostrarAviso('avisoLogin', '', false);
        google.script.run.withSuccessHandler(function (respuesta) {
          boton.disabled = false;
          if (!respuesta.ok) {
            mostrarAviso('avisoLogin', respuesta.mensaje, true);
            return;
          }
          token = respuesta.token;
          try { localStorage.setItem('tokenTienda', token); } catch (e) {}
          cargarEstado();
        }).apiIniciarSesion(
          document.getElementById('usuario').value,
          document.getElementById('clave').value
        );
      });

      document.getElementById('btnRegistrar').addEventListener('click', function () {
        var boton = this;
        boton.disabled = true;
        mostrarAviso('avisoRegistro', '', false);
        google.script.run.withSuccessHandler(function (respuesta) {
          boton.disabled = false;
          mostrarAviso('avisoRegistro', respuesta.mensaje, !respuesta.ok);
          if (respuesta.ok) {
            respuesta.autenticado = true;
            lineasRegistro = [{ productoId: '', cantidad: 1 }];
            pintarEstado(respuesta);
          }
        }).apiRegistrarFiado(token, lineasRegistro);
      });

      cargarEstado();
    </script>
  </body>
</html>
